system_monitor:
  ros__parameters:
    publish_rate: 1.0
    enabled_cpu: true
    enabled_memory: true
    enabled_disk: true
    enabled_network: true
    enabled_gpu: false
    enabled_link: false
    # Echo server (ros2 run system_monitor link_echo --port N) on the remote side.
    link_host: 127.0.0.1
    link_port: 13440
    link_probe_rate: 20.0
    link_window_s: 5.0
